version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - thank
  - ask_exams
  - ask_programs
  - ask_professors
  - ask_procedures
  - ask_orientation
  - ask_general_info
  - ask_contact_info
  - ask_stats
  - ask_formation
  - ask_announcements
  - ask_latest_news
  - ask_events
  - out_of_scope

responses:
  utter_greet:
    - text: "Bonjour ! Je suis l'assistant virtuel de la FSTS. Comment puis-je vous aider aujourd'hui?"
  
  utter_goodbye:
    - text: "Au revoir ! N'hésitez pas à me contacter si vous avez d'autres questions."
  
  utter_thank:
    - text: "Je vous en prie ! Avez-vous d'autres questions sur la FSTS?"
  
  utter_ask_exams:
    - text: "Voici le calendrier des examens pour l'année académique 2024-2025 à la FSTS :\n\n1. Premier semestre :\n   - Contrôle continu : Du 15 octobre au 15 décembre 2024\n   - Examens de fin de semestre : Du 15 au 30 janvier 2025\n\n2. Deuxième semestre :\n   - Contrôle continu : Du 15 février au 15 avril 2025\n   - Examens de fin de semestre : Du 15 au 30 mai 2025\n\n3. Session de rattrapage :\n   - Du 15 au 30 juillet 2025\n\nPour plus de détails concernant votre filière spécifique ou pour consulter les horaires précis, veuillez :\n- Consulter le site web officiel de la FSTS\n- Contacter votre département\n- Vérifier le tableau d'affichage électronique"
  
  utter_ask_programs:
    - text: "La FSTS propose plusieurs filières en licence et master. Pour des informations détaillées sur chaque programme, veuillez consulter la section appropriée sur le site web ou contacter le service de scolarité."
  
  utter_ask_professors:
    - text: "Vous pouvez trouver les coordonnées des enseignants sur le site web de la faculté ou auprès du secrétariat de votre département. La plupart des professeurs ont également des heures de permanence pendant lesquelles vous pouvez les rencontrer."
  
  utter_ask_procedures:
    - text: "Pour les procédures administratives, comme l'inscription ou les demandes de documents, veuillez vous adresser au service de scolarité au rez-de-chaussée du bâtiment administratif. Certains services sont également disponibles en ligne."
  
  utter_ask_orientation:
    - text: "Pour l'orientation et les conseils sur les débouchés professionnels, je vous recommande de contacter le service d'orientation ou de participer aux journées portes ouvertes et aux forums carrières organisés par la faculté."
  
  utter_general_info:
    - text: "La FST Settat est une institution d'enseignement supérieur qui forme et guide les futurs ingénieurs. Elle offre une éducation de qualité et collabore avec l'industrie pour préparer les étudiants aux défis technologiques et industriels de demain. Le doyen actuel est Pr. Abdelmajid Farchi."
  
  utter_contact_info:
    - text: "Voici les coordonnées de la FST Settat :\n- Téléphone : 05 23 40 07 36\n- Email : contact_fsts@uhp.ac.ma\n- Adresse : FST de Settat, Km 3, B.P. : 577 Route de Casablanca"
  
  utter_stats:
    - text: "Voici les chiffres clés de la FST Settat (au 31/12/2024) :\n- 4262 Étudiants\n- 928 Lauréats\n- 7 Départements\n- 205 Enseignants"
  
  utter_formation:
    - text: "La FST Settat propose plusieurs types de formations :\n1. Tronc Commun : Base solide en sciences fondamentales\n2. Licence en Sciences et Techniques : Formation polyvalente alliant théorie et pratique\n3. Master en Sciences et Techniques : Approfondissement des connaissances\n4. Cycle d'Ingénieur : Formation professionnelle pour des postes à responsabilités\n5. Formation continue : Pour les professionnels souhaitant se perfectionner"

  utter_ask_announcements:
    - text: "Voici les dernières annonces importantes de la FSTS :\n\n1. Inscriptions 2024-2025 : Les inscriptions pour l'année académique 2024-2025 sont ouvertes jusqu'au 30 septembre 2024.\n\n2. Examens de rattrapage : Les examens de rattrapage auront lieu du 15 au 30 juillet 2024.\n\n3. Journées portes ouvertes : Venez découvrir la FSTS lors de nos journées portes ouvertes les 25 et 26 juin 2024.\n\nPour plus d'informations, consultez régulièrement le site web de la FSTS ou le tableau d'affichage électronique."

  utter_ask_latest_news:
    - text: "Dernières actualités de la FSTS :\n\n1. Nouveau partenariat avec l'industrie : La FSTS a signé un accord de partenariat avec plusieurs entreprises pour renforcer l'insertion professionnelle des étudiants.\n\n2. Projet de recherche : Un nouveau projet de recherche en intelligence artificielle a été lancé par le département d'informatique.\n\n3. Distinction : La FSTS a reçu le prix d'excellence pour la qualité de sa formation en 2024.\n\nRestez informé en suivant nos réseaux sociaux et en consultant régulièrement notre site web."

  utter_ask_events:
    - text: "Événements à venir à la FSTS :\n\n1. Forum des métiers : 20-21 juin 2024\n2. Conférence sur l'innovation : 15 juin 2024\n3. Cérémonie de remise des diplômes : 10 juillet 2024\n4. Séminaire sur l'entrepreneuriat : 25 juin 2024\n\nPour plus de détails sur ces événements, consultez le calendrier des événements sur notre site web ou contactez le service des relations extérieures."
  
  utter_out_of_scope:
    - text: "Je suis désolé, mais je ne peux pas répondre à cette question. Je suis spécialisé dans les informations concernant la FSTS. Pourriez-vous me poser une question sur les examens, les filières, ou les démarches administratives?"

  utter_service_unavailable:
    - text: "Désolé, ce service n'est pas disponible actuellement. Je peux vous aider avec les questions concernant les examens, les programmes, les professeurs, les procédures administratives, l'orientation et les informations générales sur la FSTS."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
