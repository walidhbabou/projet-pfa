responses:
  utter_faq_exams:
    - text: "Les examens sont planifiés selon le calendrier académique. Veuillez consulter le site web officiel de la FSTS pour les dates précises. Pour plus de détails concernant votre filière spécifique, contactez votre département."

  utter_faq_programs:
    - text: "La FSTS propose plusieurs filières en licence et master. Pour des informations détaillées sur chaque programme, veuillez consulter la section appropriée sur le site web ou contacter le service de scolarité."

  utter_faq_professors:
    - text: "Vous pouvez trouver les coordonnées des enseignants sur le site web de la faculté ou auprès du secrétariat de votre département. La plupart des professeurs ont également des heures de permanence pendant lesquelles vous pouvez les rencontrer."

  utter_faq_procedures:
    - text: "Pour les procédures administratives, comme l'inscription ou les demandes de documents, veuillez vous adresser au service de scolarité au rez-de-chaussée du bâtiment administratif. Certains services sont également disponibles en ligne."

  utter_faq_orientation:
    - text: "Pour l'orientation et les conseils sur les débouchés professionnels, je vous recommande de contacter le service d'orientation ou de participer aux journées portes ouvertes et aux forums carrières organisés par la faculté."

  utter_contact_info:
    - text: "Voici les coordonnées de la FST Settat :\n- Téléphone : 05 23 40 07 36\n- Email : contact_fsts@uhp.ac.ma\n- Adresse : FST de Settat, Km 3, B.P. : 577 Route de Casablanca"

  utter_stats:
    - text: "Voici les chiffres clés de la FST Settat (au 31/12/2024) :\n- 4262 Étudiants\n- 928 Lauréats\n- 7 Départements\n- 205 Enseignants"

  utter_formation:
    - text: "La FST Settat propose plusieurs types de formations :\n1. Tronc Commun : Base solide en sciences fondamentales\n2. Licence en Sciences et Techniques : Formation polyvalente alliant théorie et pratique\n3. Master en Sciences et Techniques : Approfondissement des connaissances\n4. Cycle d'Ingénieur : Formation professionnelle pour des postes à responsabilités\n5. Formation continue : Pour les professionnels souhaitant se perfectionner"

  utter_general_info:
    - text: "La FST Settat est une institution d'enseignement supérieur qui forme et guide les futurs ingénieurs. Elle offre une éducation de qualité et collabore avec l'industrie pour préparer les étudiants aux défis technologiques et industriels de demain. Le doyen actuel est Pr. Abdelmajid Farchi."
