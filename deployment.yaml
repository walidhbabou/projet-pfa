apiVersion: v1
kind: Namespace
metadata:
  name: chatbootfsts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cors-config
  namespace: chatbootfsts
data:
  CORS_ORIGINS: "http://107.21.73.241:30089"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_HEADERS: "Content-Type,Authorization,Accept"
  CORS_SUPPORTS_CREDENTIALS: "true"
  CORS_MAX_AGE: "3600"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: chatbootfsts
data:
  MONGO_URI: "mongodb://mongo:27017/fsts_assistance"
  JWT_SECRET_KEY: "39NtsAHJrQh0fdR2YoqU+dX1oJWly2Vsm/yHdnOQ19Q="
  RASA_API_URL: "http://107.21.73.241:32441"
  VITE_API_URL: "http://107.21.73.241:30080/api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbootfsts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: walidhbabou/chatbootfsts-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        - configMapRef:
            name: cors-config
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_HOST
          value: "0.0.0.0"
        - name: FLASK_PORT
          value: "5000"
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chatbootfsts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: walidhbabou/chatbootfsts-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        command: ["sh"]
        args: ["-c", "cd /app && npm install && npm run build && npm run preview -- --port 8081 --host 0.0.0.0"]
        env:
        - name: VITE_API_URL
          value: "http://107.21.73.241:30080/api"
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: chatbootfsts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: "fsts_assistance"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasa
  namespace: chatbootfsts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rasa
  template:
    metadata:
      labels:
        app: rasa
    spec:
      initContainers:
      - name: init-rasa
        image: walidhbabou/chatbootfsts-rasa:latest
        command: ['sh', '-c', 'cp -r /app/models/* /rasa-models/ && ls -la /rasa-models/']
        volumeMounts:
        - name: rasa-models
          mountPath: /rasa-models
      containers:
      - name: rasa
        image: walidhbabou/chatbootfsts-rasa:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5005
        env:
        - name: RASA_MODEL_PATH
          value: "/rasa-models"
        - name: SANIC_HOST
          value: "0.0.0.0"
        - name: SANIC_PORT
          value: "5005"
        command: ["sh"]
        args: ["-c", "ls -la /rasa-models && rasa run --enable-api --cors '*' --model /rasa-models/$(ls /rasa-models | grep .tar.gz)"]
        volumeMounts:
        - name: rasa-models
          mountPath: /rasa-models
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /status
            port: 5005
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 5005
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
      volumes:
      - name: rasa-models
        persistentVolumeClaim:
          claimName: rasa-models-pvc
---
# Services
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatbootfsts
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chatbootfsts
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30089
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: chatbootfsts
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: rasa
  namespace: chatbootfsts
spec:
  type: NodePort
  selector:
    app: rasa
  ports:
    - protocol: TCP
      port: 5005
      targetPort: 5005
      nodePort: 32441
---
# Persistent Volumes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: chatbootfsts
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rasa-models-pvc
  namespace: chatbootfsts
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi